{% extends "base.html" %}
{% block title %}Log in · Zoble Chat{% endblock %}

{% block body %}
<div class="auth-screen">
    <div class="auth-card">
        <div class="brand-mark">
            <span class="brand-dot"></span>
            <span class="brand-word">Zoble Chat</span>
        </div>
        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-subheading">Log in to keep the conversation going.</p>

        <form id="loginForm" class="auth-form" novalidate>
            <label class="field-label" for="username">Username or email</label>
            <input class="field-input" type="text" id="username" name="username" autocomplete="username" required>

            <label class="field-label" for="password">Password</label>
            <input class="field-input" type="password" id="password" name="password" autocomplete="current-password" required>

            <p class="field-error" id="loginError" hidden></p>

            <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register_page') }}">Create one</a></p>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("loginError");
        errorEl.hidden = true;

        const payload = {
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
        };

        try {
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            const data = await res.json();

            if (!res.ok) {
                errorEl.textContent = data.error || "Something went wrong.";
                errorEl.hidden = false;
                return;
            }

            window.location.href = "/";
        } catch (err) {
            errorEl.textContent = "Network error. Please try again.";
            errorEl.hidden = false;
        }
    });
</script>
{% endblock %}
