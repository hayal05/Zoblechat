{% extends "base.html" %}
{% block title %}Create account · Zoble Chat{% endblock %}

{% block body %}
<div class="auth-screen">
    <div class="auth-card">
        <div class="brand-mark">
            <span class="brand-dot"></span>
            <span class="brand-word">Zoble Chat</span>
        </div>
        <h1 class="auth-heading">Create your account</h1>
        <p class="auth-subheading">Pick a username, set a password, start chatting.</p>

        <form id="registerForm" class="auth-form" novalidate>
            <label class="field-label" for="fullName">Name</label>
            <input class="field-input" type="text" id="fullName" name="full_name" autocomplete="name" maxlength="60" required>

            <div class="contact-toggle" role="tablist" aria-label="Sign up with">
                <button type="button" class="contact-toggle-btn is-active" id="contactTabEmail" role="tab" aria-selected="true">Email</button>
                <button type="button" class="contact-toggle-btn" id="contactTabPhone" role="tab" aria-selected="false">Phone number</button>
            </div>

            <div id="emailField">
                <label class="field-label" for="email">Email</label>
                <input class="field-input" type="email" id="email" name="email" autocomplete="email">
            </div>

            <div id="phoneField" hidden>
                <label class="field-label" for="phone">Phone number</label>
                <input class="field-input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+15551234567">
            </div>

            <label class="field-label" for="username">Username</label>
            <input class="field-input" type="text" id="username" name="username" autocomplete="username" required>

            <label class="field-label" for="password">Password</label>
            <input class="field-input" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
            <p class="field-hint">At least 8 characters, with a letter and a number.</p>

            <p class="field-error" id="registerError" hidden></p>

            <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
    </div>
</div>

<script>
    const contactTabEmail = document.getElementById("contactTabEmail");
    const contactTabPhone = document.getElementById("contactTabPhone");
    const emailField = document.getElementById("emailField");
    const phoneField = document.getElementById("phoneField");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");

    let contactMethod = "email";

    function setContactMethod(method) {
        contactMethod = method;
        const isEmail = method === "email";

        emailField.hidden = !isEmail;
        phoneField.hidden = isEmail;
        emailInput.required = isEmail;
        phoneInput.required = !isEmail;

        contactTabEmail.classList.toggle("is-active", isEmail);
        contactTabEmail.setAttribute("aria-selected", String(isEmail));
        contactTabPhone.classList.toggle("is-active", !isEmail);
        contactTabPhone.setAttribute("aria-selected", String(!isEmail));
    }

    contactTabEmail.addEventListener("click", () => setContactMethod("email"));
    contactTabPhone.addEventListener("click", () => setContactMethod("phone"));

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("registerError");
        errorEl.hidden = true;

        const payload = {
            full_name: document.getElementById("fullName").value.trim(),
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            contact_method: contactMethod,
            email: contactMethod === "email" ? emailInput.value.trim() : "",
            phone: contactMethod === "phone" ? phoneInput.value.trim() : "",
        };

        try {
            const res = await fetch("/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            const data = await res.json();

            if (!res.ok) {
                errorEl.textContent = data.error || "Something went wrong.";
                errorEl.hidden = false;
                return;
            }

            window.location.href = "/";
        } catch (err) {
            errorEl.textContent = "Network error. Please try again.";
            errorEl.hidden = false;
        }
    });
</script>
{% endblock %}
